[project]
name = "recrutas-matcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pyarrow>=15", "huggingface_hub>=0.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["matcher"]

[tool.ruff]
line-length = 130
target-version = "py311"
