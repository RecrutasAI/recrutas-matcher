name: Match

# Every 4 hours: match each Recrutas user's resume vector against every open Fleet job and write
# the outbox the Recrutas server picks up. The heavy work is here so the server only exchanges
# small files. Logs carry counts only; no user data or job data is printed or uploaded as an artifact.
on:
  schedule:
    - cron: "13 2,6,10,14,18,22 * * *"   # off the top of the hour: GitHub delays or drops :00 schedules
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Match without writing the outbox"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -e .
      - name: Match
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m matcher.cli ${{ inputs.dry_run && '--dry-run' || '' }}
