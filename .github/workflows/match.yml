name: Match

# After each Recrutas export (6 a day, at :50 of 1, 5, 9, 13, 17, 21 UTC): match each user's resume
# vector against every open Fleet job and write the outbox the Recrutas server picks up. The heavy
# work is here so the server only exchanges small files. Logs carry counts only; no user data or job
# data is printed or uploaded as an artifact.
on:
  schedule:
    # Every half hour, off the top of the hour. GitHub drops many scheduled runs: with two slots per
    # 4-hour cycle the matcher ran 2 or 3 times a day instead of 6 (Nov 20 2026). A slot with no new
    # export exits in seconds (--if-new), and this repo is public, so the extra slots cost nothing.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Match without writing the outbox"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -e .
      - name: Match
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m matcher.cli ${{ github.event_name == 'schedule' && '--if-new' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
